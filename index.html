<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEBULA STORE | Experiência 3D Premium</title>
    <!-- Fonte foda -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Animate CSS pra transições suaves -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
        }

        /* Canvas 3D fica atrás do conteúdo */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Conteúdo principal */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        /* Header transparente */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 8%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .cart-icon {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }

        .cart-icon:hover {
            background: rgba(168,85,247,0.3);
            transform: scale(1.05);
        }

        /* Hero section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 90vh;
            padding: 20px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c084fc, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.3rem;
            color: #ccc;
            max-width: 600px;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease 0.1s both;
        }

        .price-tag {
            font-size: 3rem;
            font-weight: 700;
            color: #a855f7;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .btn-comprar {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            padding: 16px 42px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(168,85,247,0.5);
            animation: fadeInUp 1s ease 0.3s both;
            position: relative;
            overflow: hidden;
        }

        .btn-comprar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168,85,247,0.8);
        }

        .btn-comprar:active {
            transform: scale(0.98);
        }

        /* Seção de features */
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 80px 8%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            margin-top: 50px;
        }

        .feature-card {
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 250px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            background: rgba(168,85,247,0.1);
            border-color: rgba(168,85,247,0.5);
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .feature-card h3 {
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .feature-card p {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Notificação */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            z-index: 1000;
            border-left: 4px solid #a855f7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .hero p {
                font-size: 1rem;
            }
            .price-tag {
                font-size: 2rem;
            }
            .btn-comprar {
                padding: 12px 32px;
                font-size: 1rem;
            }
            .features {
                gap: 20px;
                padding: 50px 5%;
            }
            .feature-card {
                width: 200px;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8rem;
            }
            .feature-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="content">
    <div class="header">
        <div class="logo">✦ NEBULA STORE ✦</div>
        <div class="cart-icon" id="cart-btn">
            🛒 <span id="cart-count">0</span>
        </div>
    </div>

    <div class="hero">
        <h1>FUTURO NO SEU <br> PULSO</h1>
        <p>Produto exclusivo com tecnologia de ponta. Design que chama atenção onde você vai.</p>
        <div class="price-tag">R$ 399,90</div>
        <button class="btn-comprar" id="comprar-btn">💎 ADQUIRIR AGORA 💎</button>
    </div>

    <div class="features">
        <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <h3>Velocidade</h3>
            <p>Entrega em até 24h</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">🔒</div>
            <h3>Segurança</h3>
            <p>Pagamento criptografado</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">🎨</div>
            <h3>Design Único</h3>
            <p>Edição limitada</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // ==================== THREE.JS CENA 3D FODA ====================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Luzes dramáticas
    const ambientLight = new THREE.AmbientLight(0x2a2a3a);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xffffff, 1);
    mainLight.position.set(3, 5, 2);
    mainLight.castShadow = true;
    scene.add(mainLight);
    
    const backLight = new THREE.PointLight(0xa855f7, 0.6);
    backLight.position.set(-2, 1, -3);
    scene.add(backLight);
    
    const fillLight = new THREE.PointLight(0x3b82f6, 0.4);
    fillLight.position.set(2, 1, 2);
    scene.add(fillLight);
    
    const colorLight = new THREE.PointLight(0xec4899, 0.5);
    colorLight.position.set(1, 2, 1);
    scene.add(colorLight);

    // Produto principal: Torus Knot estiloso (simula produto premium)
    const geometry = new THREE.TorusKnotGeometry(0.9, 0.22, 180, 32, 3, 4);
    const material = new THREE.MeshStandardMaterial({
        color: 0xa855f7,
        metalness: 0.85,
        roughness: 0.25,
        emissive: 0x3b0764,
        emissiveIntensity: 0.3
    });
    const product = new THREE.Mesh(geometry, material);
    product.castShadow = true;
    product.receiveShadow = false;
    scene.add(product);

    // Anel giratório ao redor
    const ringGeo = new THREE.TorusGeometry(1.15, 0.04, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0x6b21a8, emissiveIntensity: 0.2 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);

    // Partículas flutuantes
    const particleCount = 1200;
    const particlesGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 20;
        positions[i*3+1] = (Math.random() - 0.5) * 12;
        positions[i*3+2] = (Math.random() - 0.5) * 15 - 5;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0xa855f7, size: 0.05, transparent: true, opacity: 0.5 });
    const particles = new THREE.Points(particlesGeometry, particleMat);
    scene.add(particles);

    // Efeito de estrelas ao fundo
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPos[i*3] = (Math.random() - 0.5) * 200;
        starPos[i*3+1] = (Math.random() - 0.5) * 100;
        starPos[i*3+2] = (Math.random() - 0.5) * 80 - 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.4 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // Animação
    let time = 0;
    let heartExplosion = [];

    function createHeartExplosion() {
        heartExplosion.forEach(h => scene.remove(h));
        heartExplosion = [];
        for (let i = 0; i < 150; i++) {
            const heartGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const heartMat = new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0xbe185d, emissiveIntensity: 0.6 });
            const heart = new THREE.Mesh(heartGeo, heartMat);
            heart.userData = {
                vel: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    Math.random() * 0.6,
                    (Math.random() - 0.5) * 0.4
                ),
                life: 1.0
            };
            heart.position.set(0, 0, 0);
            scene.add(heart);
            heartExplosion.push(heart);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        time += 0.012;

        product.rotation.x = Math.sin(time * 0.4) * 0.2;
        product.rotation.y = time * 0.6;
        product.rotation.z = Math.cos(time * 0.3) * 0.1;
        
        ring.rotation.x = time * 0.5;
        ring.rotation.z = time * 0.3;
        
        particles.rotation.y = time * 0.05;
        particles.rotation.x = Math.sin(time * 0.1) * 0.1;
        
        stars.rotation.y = time * 0.01;
        stars.rotation.x = time * 0.005;

        // Movimento suave da câmera
        camera.position.x += (0 - camera.position.x) * 0.03;
        camera.position.y += (Math.sin(time * 0.2) * 0.05 - camera.position.y) * 0.03;

        // Atualizar corações
        for (let i = heartExplosion.length-1; i >= 0; i--) {
            const h = heartExplosion[i];
            h.userData.life -= 0.012;
            if (h.userData.life <= 0) {
                scene.remove(h);
                heartExplosion.splice(i,1);
                continue;
            }
            h.position.x += h.userData.vel.x;
            h.position.y += h.userData.vel.y;
            h.position.z += h.userData.vel.z;
            h.material.emissiveIntensity = h.userData.life * 0.8;
            h.scale.setScalar(h.userData.life);
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Expor função pro clique
    window.trigger3DHeart = createHeartExplosion;

    // ==================== INTEGRAÇÃO SHOPIFY ====================
    let cartItemCount = 0;
    const cartCountSpan = document.getElementById('cart-count');
    const buyBtn = document.getElementById('comprar-btn');

    function showNotification(msg, isError = false) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerHTML = msg;
        notif.style.background = isError ? 'rgba(220,38,38,0.9)' : 'rgba(0,0,0,0.9)';
        notif.style.borderLeftColor = isError ? '#ef4444' : '#a855f7';
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }

    async function addToCart(variantId, quantity = 1) {
        try {
            const response = await fetch('/cart/add.js', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: variantId, quantity: quantity })
            });
            const data = await response.json();
            if (response.ok) {
                cartItemCount += quantity;
                cartCountSpan.innerText = cartItemCount;
                showNotification('✨ Produto adicionado com sucesso! ✨');
                if (window.trigger3DHeart) window.trigger3DHeart();
                return true;
            } else {
                throw new Error(data.description || 'Erro');
            }
        } catch (err) {
            console.error('ByBot erro:', err);
            showNotification('❌ Não foi possível adicionar. Tente novamente.', true);
            return false;
        }
    }

    async function updateCartCount() {
        try {
            const resp = await fetch('/cart.js');
            const cart = await resp.json();
            cartItemCount = cart.item_count || 0;
            cartCountSpan.innerText = cartItemCount;
        } catch(e) {
            console.warn('Não foi possível sincronizar carrinho');
            cartItemCount = 0;
            cartCountSpan.innerText = '0';
        }
    }

    // PEGAR O VARIANT ID DO PRODUTO ATUAL (funciona dentro do Shopify)
    let currentVariantId = null;
    async function getProductVariantId() {
        // Tenta pegar do data do produto (se estiver em product.liquid)
        if (typeof window.productJson !== 'undefined' && window.productJson) {
            return window.productJson.variants[0]?.id;
        }
        // Fallback: se não achar, tenta pegar da URL
        const urlParams = new URLSearchParams(window.location.search);
        let productHandle = urlParams.get('product');
        if (!productHandle && window.location.pathname.includes('/products/')) {
            productHandle = window.location.pathname.split('/products/')[1]?.split('/')[0];
        }
        if (productHandle) {
            try {
                const resp = await fetch(`/products/${productHandle}.js`);
                const product = await resp.json();
                return product.variants[0]?.id;
            } catch(e) {}
        }
        // Fallback hardcoded (troque pelo ID do teu produto)
        return 12345678901234; // SUBSTITUA PELO ID REAL
    }

    // Inicialização
    (async () => {
        await updateCartCount();
        currentVariantId = await getProductVariantId();
        
        buyBtn.addEventListener('click', async () => {
            // animação no botão
            buyBtn.style.transform = 'scale(0.95)';
            setTimeout(() => { buyBtn.style.transform = ''; }, 150);
            
            if (currentVariantId) {
                await addToCart(currentVariantId, 1);
            } else {
                showNotification('⚠️ Produto não configurado. Contate o suporte.', true);
            }
        });
        
        document.getElementById('cart-btn').addEventListener('click', () => {
            window.location.href = '/cart';
        });
    })();
</script>
</body>
</html>
